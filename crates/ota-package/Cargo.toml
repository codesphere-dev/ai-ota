[package]
name = "ota-package"
description = "The versioned OTA package container format (read/write/validate)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["ota", "embedded", "updater"]
categories = ["embedded", "encoding"]

[dependencies]
ota-core = { path = "../ota-core", default-features = false }
crc32fast.workspace = true
sha2.workspace = true
thiserror.workspace = true

[features]
default = ["std"]
std = ["ota-core/std"]

[lints]
workspace = true
