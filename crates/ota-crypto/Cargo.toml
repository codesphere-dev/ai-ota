[package]
name = "ota-crypto"
description = "Signing, hashing and verification primitives for secure updates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["ota", "crypto", "signature"]
categories = ["cryptography", "embedded"]

[dependencies]
ota-core = { path = "../ota-core", default-features = false }
ed25519-dalek = { workspace = true, features = ["signature"] }
thiserror.workspace = true

[features]
default = ["std"]
std = ["ota-core/std", "ed25519-dalek/std"]

[lints]
workspace = true
