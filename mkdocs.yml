site_name: ai-ota
site_description: Documentation ai-ota, plateforme OTA pour firmware et modèles embarqués
site_url: https://codesphere-dev.github.io/ai-ota/
repo_url: https://github.com/codesphere-dev/ai-ota
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: fr
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Mode sombre
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Mode clair

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details

plugins:
  - search

nav:
  - Accueil: index.md

  - Ingénierie:
      - Index: engineering/index.md
      - API:
          - Index: engineering/api/index.md
          - CLI: engineering/api/cli/index.md
          - Python: engineering/api/python/index.md
          - Transport: engineering/api/transport/index.md
      - Architecture:
          - Index: engineering/architecture/index.md
          - ADR: engineering/architecture/adr/index.md
          - Modèles C4:
              - Index: engineering/architecture/c4/index.md
              - Code: engineering/architecture/c4/code/index.md
              - Composants: engineering/architecture/c4/components/index.md
          - Dispositif: engineering/architecture/device/index.md
          - Noyau OTA: engineering/architecture/ota-core/index.md
          - Pipeline: engineering/architecture/pipeline/index.md
      - Données:
          - Index: engineering/data/index.md
          - Flotte: engineering/data/fleet/index.md
          - Modèles: engineering/data/models/index.md
          - Paquets: engineering/data/packages/index.md
      - Conception:
          - Index: engineering/design/index.md
          - Agent dispositif: engineering/design/device-agent/index.md
          - Serveur: engineering/design/server/index.md
      - Exploitation:
