[graph]
targets = [
  { triple = "thumbv7em-none-eabihf" },
  { triple = "thumbv6m-none-eabi" },
  { triple = "riscv32imac-unknown-none-elf" },
  { triple = "aarch64-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-musl" },
  { triple = "riscv64gc-unknown-linux-gnu" },
  { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
notice = "warn"
ignore = []

[bans]
version = 2
multiple-versions = "warn"
deny = [
  { name = "openssl", reason = "use rustls or ring instead" },
  { name = "openssl-sys", reason = "use rustls or ring instead" },
  { name = "libc", reason = "not portable to no_std targets" },
  { name = "musl", reason = "prefer cargo-musl or zig build to native musl crates" },
]
skip = []

[licenses]
version = 2
allow = [
  "GPL-3.0-only",
  "GPL-3.0-or-later",
]
private = { ignore = true }
unused-allowed-license = "warn"

[sources]
version = 2
unknown-registry = "warn"
unknown-git = "warn"
allow-git = []